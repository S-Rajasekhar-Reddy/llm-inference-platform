# k3s inside WSL2, one RTX 5080 Laptop GPU (16 GB).
# make up-local fills cache.hostPath.* from $HOME, so nothing here is user-specific.
runtimeClassName: nvidia
hfOffline: true           # weights are already cached locally
cache:
  type: hostPath

# Default: one replica with the whole GPU (chart defaults: gpuMemoryUtilization 0.85,
# KV cache sized by vLLM). bench/results/replicas/ shows why: on one GPU, one instance
# with a big KV cache beat two small replicas at every load. The 2-replica KEDA demo is
# an overlay: values-local-keda.yaml (`make up-local KEDA=1`).

monitoring:
  serviceMonitor:
    enabled: true
  dashboard:
    enabled: true
  alerts:
    enabled: true
