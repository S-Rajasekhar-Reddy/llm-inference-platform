# k3s inside WSL2, one RTX 5080 Laptop GPU (16 GB).
# make up-local fills cache.hostPath.* from $HOME, so nothing here is user-specific.
runtimeClassName: nvidia
hfOffline: true           # weights are already cached locally
cache:
  type: hostPath

# Two replicas share the 16 GB GPU (device plugin time-slicing = 2). Each pod gets
# 0.4 x 16 GB at startup and a pinned 1.5 GiB KV cache (~14k tokens for Qwen3-1.7B),
# about 6 GiB in total, so both fit next to the ~1.5 GB Windows uses.
model:
  gpuMemoryUtilization: 0.4
  kvCacheMemoryBytes: 1610612736

autoscaling:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true
  dashboard:
    enabled: true
  alerts:
    enabled: true
