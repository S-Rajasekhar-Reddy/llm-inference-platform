# Defaults are environment-neutral. Environment files layer on top:
#   values-local.yaml  k3s in WSL2 on the RTX 5080 Laptop GPU (hostPath caches)
#   values-cloud.yaml  EKS with an L4 node (week 3)

image:
  repository: vllm/vllm-openai
  tag: v0.33.0            # pinned; bump deliberately
  pullPolicy: IfNotPresent

model:
  name: Qwen/Qwen3-1.7B   # Hugging Face id, or a local path (values-cloud.yaml: /models/...)
  # Name clients use in requests. Empty = model.name. Set it when name is a path, so the
  # API (and the benchmark) still see the Hugging Face id.
  servedModelName: ""
  maxModelLen: 8192
  # Always passed. vLLM checks at startup that this share of total GPU memory is
  # free, even when kvCacheMemoryBytes pins the KV cache, so two pods sharing a GPU
  # each need a value that fits next to the other (values-local.yaml: 0.4).
  gpuMemoryUtilization: 0.85
  # Pin KV-cache bytes so capacity does not change between cold and warm boots
  # (vllm#54383) and so two replicas get the same budget. Empty = vLLM sizes it.
  kvCacheMemoryBytes: ""

# Extra vLLM CLI flags, appended as-is, e.g. ["--kv-cache-dtype", "fp8"]
extraArgs: []

# Extra environment variables for the vLLM container
env: []

# Set HF_HUB_OFFLINE=1 once weights are in the cache (skips Hugging Face network checks)
hfOffline: false

replicaCount: 1            # ignored when autoscaling.enabled (KEDA owns replicas)

# With one GPU a rolling update would start a second pod that cannot fit,
# so the default replaces the pod instead (brief downtime, no OOM).
strategy:
  type: Recreate

runtimeClassName: ""      # "nvidia" on k3s; empty on EKS (the GPU AMI sets the default runtime)

gpu:
  # Request the GPU through the NVIDIA device plugin (nvidia.com/gpu).
  # Set false only where the plugin cannot run; the pod then relies on runtimeClassName alone.
  request: true
  count: 1

resources: {}             # CPU/memory requests and limits, merged with the GPU limit

# Copy the weights from S3 to the node's disk before vLLM starts (design decision D9), so
# cold start measures loading, not a Hugging Face download. Credentials come from the
# service account (EKS Pod Identity), not the node role.
weights:
  s3:
    enabled: false
    uri: ""                 # s3://bucket/models/<model>/ (make up-cloud sets it from Terraform)
    path: /models/model     # where the files land; point model.name here
    sizeLimit: 30Gi
    region: us-east-1
    image: public.ecr.aws/aws-cli/aws-cli:2.22.0

serviceAccount:
  create: false
  name: ""                  # empty = default service account (create=false) or the release name

service:
  type: ClusterIP
  port: 8000

# Caches survive pod restarts so weights are not re-downloaded and
# torch.compile results are reused (cold start ~35 min -> ~2.3 min on the laptop).
cache:
  type: emptyDir          # hostPath | emptyDir
  hostPath:
    huggingface: ""       # e.g. /home/<user>/.cache/huggingface (set by make up-local)
    vllm: ""              # e.g. /home/<user>/.cache/vllm

shm:
  sizeLimit: 2Gi          # replaces Docker's --ipc=host

probes:
  startup:
    periodSeconds: 5
    failureThreshold: 120 # up to 10 min for a cold compile and CUDA graph capture
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 20
    failureThreshold: 3

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus Operator objects. Needs the CRDs from kube-prometheus-stack
# (`make monitoring-up`); values-local.yaml turns all three on.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    labels: {}
  dashboard:
    enabled: false        # ConfigMap labelled grafana_dashboard="1" for the Grafana sidecar
  alerts:
    enabled: false
    labels: {}
    # 1. Users are waiting: p95 time to first token above the SLO.
    #    1 s is the draft chat SLO in the design doc; fix it after the E1 saturation run.
    ttft:
      sloSeconds: 1
      for: 5m
    # 2. Out of capacity: requests queue up although replicas are already at the maximum.
    #    Empty = follow autoscaling.queueThreshold / maxReplicaCount (or 5 and 1 without KEDA).
    queue:
      threshold: ""         # average vllm:num_requests_waiting per ready pod
      maxReplicas: ""
      for: 2m
    # 3. Paying for an idle GPU: a ready vLLM pod finished no requests and runs none.
    idle:
      window: 5m            # rate() window used to decide "zero requests"
      for: 30m

# KEDA scales the Deployment on queue depth (vllm:num_requests_waiting) read from
# Prometheus. Needs the KEDA CRDs (`make keda-up`). When enabled, monitoring.alerts.queue
# takes its threshold and max replicas from here, so the alert and the scaler agree.
autoscaling:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 2
  queueThreshold: 5         # target waiting requests per replica (AverageValue)
  # With minReplicaCount >= 1 the HPA does the scaling (it reads KEDA's metric every
  # 15 s), so KEDA's pollingInterval/cooldownPeriod don't apply and aren't set; scale-down
  # timing is this stabilisation window.
  scaleDownStabilizationSeconds: 120
  prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
